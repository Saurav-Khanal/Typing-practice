<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typing-practice</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="status-view">
        <div class="box">
          <h1>Time</h1>
          <h2 id="time">0</h2>
        </div>
        <div class="box">
          <h1>WPM</h1>
          <h2 id="wpm">0</h2>
        </div>
        <div class="box">
          <h1>Mistake</h1>
          <h2 id="mistake">0</h2>
        </div>
      </div>
      <div class="typing-container">
        <div class="typing-des">
          <p id="description"></p>
        </div>
        <div class="typing-div">
          <textarea class="typing-area" id="test" rows="4" cols="50"></textarea>
        </div>
        <button id="button">Start Test</button>
      </div>
      <hr />
      <div class="bottom-area">
        <h1>press any key to start</h1>
        <p>Highest wpm:</p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
